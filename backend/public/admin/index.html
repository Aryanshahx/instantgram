<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>InstantGram Admin</title>
<style>
  :root {
    --bg: #0d0f14; --card: #161a22; --card2: #1d222c; --line: #2a303c;
    --text: #f2f4f8; --muted: #8e96a6; --lime: #c6ff3d; --red: #ff4d6d; --blue: #3897f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--lime); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px;
    background: var(--card2); color: var(--text); font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; }
  button.lime { background: var(--lime); color: #111; }
  button.red { background: rgba(255,77,109,.15); color: var(--red); }
  button.blue { background: rgba(56,151,240,.15); color: var(--blue); }
  button.ghost { background: transparent; color: var(--muted); }
  input, textarea, select { font: inherit; color: var(--text); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--lime); border-color: transparent; }
  .hide { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
  .logo b { color: var(--lime); }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; width: 100%; max-width: 360px; }
  .box h1 { margin: 0 0 4px; font-size: 22px; }
  .box label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 12px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,77,109,.12); color: #ffb3c1; font-size: 13px; word-break: break-word; }
  .msg.ok { background: rgba(198,255,61,.12); color: var(--lime); }

  /* app */
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,15,20,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 10px 16px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { background: transparent; color: var(--muted); padding: 7px 12px; white-space: nowrap; }
  nav button.on { background: rgba(198,255,61,.12); color: var(--lime); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  h2 { margin: 6px 0 14px; font-size: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 800; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .item:hover { border-color: #3a4252; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--card2) center/cover; flex: none;
    display: grid; place-items: center; font-weight: 800; color: var(--muted); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .tag.red { background: rgba(255,77,109,.15); color: var(--red); }
  .tag.blue { background: rgba(56,151,240,.15); color: var(--blue); }
  .tag.lime { background: rgba(198,255,61,.12); color: var(--lime); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--card2) center/cover; cursor: pointer; border: 1px solid var(--line); }
  .tile .meta { position: absolute; inset: auto 0 0 0; padding: 18px 8px 6px; font-size: 11px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .tile .kind { position: absolute; top: 6px; left: 6px; }
  .more { margin: 14px auto 0; display: block; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button.on { background: var(--lime); color: #111; }

  /* drawer */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg);
    border-left: 1px solid var(--line); z-index: 11; overflow-y: auto; padding: 16px 18px 40px; }
  .media { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
  .media img, .media video { height: 320px; max-width: 100%; border-radius: 12px; background: #000; }
  .comment { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 13px; margin: 10px 0; }
  .kv div:nth-child(odd) { color: var(--muted); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--card2);
    border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 20; max-width: 90vw; }
  .progress { height: 8px; background: var(--card2); border-radius: 9px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; width: 0; background: var(--lime); transition: width .3s; }
</style>
</head>
<body>

<!-- ============ login ============ -->
<section id="login" class="hide">
  <form class="box" id="loginForm" autocomplete="on">
    <div class="logo">Instant<b>Gram</b></div>
    <h1>Admin</h1>
    <div class="muted small">Type the admin password (ADMIN_PASSWORD on Vercel).</div>
    <input type="text" name="username" value="instantgram-admin" autocomplete="username" class="hide" aria-hidden="true">
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="16">
    <button class="lime" style="width:100%;margin-top:18px" id="loginBtn">Log in</button>
    <div id="loginMsg" class="msg hide"></div>
  </form>
</section>

<!-- ============ app ============ -->
<section id="app" class="hide">
  <header>
    <div class="row" style="margin-bottom:8px">
      <div class="logo grow">Instant<b>Gram</b> <span class="muted small">admin</span></div>
      <span id="who" class="muted small"></span>
      <button class="ghost small" id="logout">Log out</button>
    </div>
    <nav id="nav">
      <button data-page="dash" class="on">Dashboard</button>
      <button data-page="users">Users</button>
      <button data-page="posts">Posts &amp; clips</button>
      <button data-page="reports">Reports</button>
      <button data-page="notice">Send notice</button>
    </nav>
  </header>
  <main>
    <div id="page-dash">
      <div class="row"><h2 class="grow">Dashboard</h2><button id="dashRefresh">Refresh</button></div>
      <div class="cards" id="stats"></div>
      <h2 style="margin-top:24px">Newest users</h2>
      <div class="list" id="dashUsers"></div>
      <h2 style="margin-top:24px">Newest posts</h2>
      <div class="grid" id="dashPosts"></div>
    </div>

    <div id="page-users" class="hide">
      <h2>Users</h2>
      <div class="tabs" id="userTabs">
        <button data-filter="new" class="on">Newest</button>
        <button data-filter="followers">Most followers</button>
        <button data-filter="verified">Verified</button>
        <button data-filter="banned">Blocked</button>
        <button data-filter="private">Private</button>
        <button data-filter="online">Online now</button>
        <button data-filter="country">Country</button>
        <input id="userCountry" class="hide" maxlength="2" placeholder="IN" style="width:70px;text-transform:uppercase">
      </div>
      <form class="row" id="userSearch" style="margin-bottom:12px">
        <input id="userQ" class="grow" placeholder="Search username, email or user id" style="flex:1;width:auto">
        <button class="lime">Search</button>
      </form>
      <div class="list" id="userList"></div>
      <button class="more hide" id="userMore">Load more</button>
    </div>

    <div id="page-posts" class="hide">
      <h2>Posts &amp; clips</h2>
      <div class="tabs" id="postTabs">
        <button data-type="all" class="on">All</button>
        <button data-type="clip">Clips</button>
        <button data-type="photo">Posts</button>
        <button data-type="moment">Moments</button>
      </div>
      <div class="grid" id="postGrid"></div>
      <button class="more hide" id="postMore">Load more</button>
    </div>

    <div id="page-reports" class="hide">
      <div class="row"><h2 class="grow">Reports</h2><button id="repRefresh">Refresh</button></div>
      <div class="muted small" style="margin-bottom:10px">Reports from the app. Press Done after you handled one.</div>
      <div class="tabs" id="repTabs">
        <button data-kind="" class="on">All</button>
        <button data-kind="post">Posts</button>
        <button data-kind="clip">Clips</button>
        <button data-kind="comment">Comments</button>
        <button data-kind="user">Users</button>
        <select id="repReason" style="width:auto">
          <option value="">Any reason</option>
          <option>Spam</option><option>Nudity or sexual content</option><option>Hate speech</option>
          <option>Violence or dangerous acts</option><option>Bullying or harassment</option><option>Scam or fraud</option>
          <option>False information</option><option>Copyright</option><option>Something else</option>
        </select>
      </div>
      <div class="muted small hide" id="repInfo" style="margin-bottom:8px"></div>
      <div class="list" id="repList"></div>
      <button class="more hide" id="repMore">Load more</button>
    </div>

    <div id="page-notice" class="hide">
      <h2>Send notice</h2>
      <div class="box" style="max-width:560px">
        <label class="muted small">Send to</label>
        <div class="row" style="margin:6px 0 12px">
          <label class="row"><input type="radio" name="to" value="all" checked style="width:auto"> Everyone</label>
          <label class="row"><input type="radio" name="to" value="one" style="width:auto"> One user</label>
        </div>
        <div id="noticeOne" class="hide" style="margin-bottom:12px">
          <input id="noticeUser" placeholder="username">
          <div class="small muted" id="noticeUserInfo" style="margin-top:6px"></div>
        </div>
        <label class="muted small">Title</label>
        <input id="noticeTitle" value="InstantGram" maxlength="80" style="margin:6px 0 12px">
        <label class="muted small">Message</label>
        <textarea id="noticeText" rows="5" maxlength="900" style="margin-top:6px" placeholder="Write your message"></textarea>
        <label class="muted small" style="display:block;margin-top:12px">Picture (optional)</label>
        <div class="row" style="margin-top:6px">
          <input id="noticeImg" type="file" accept="image/*" style="flex:1;width:auto">
          <button type="button" class="ghost small hide" id="noticeImgDel">Remove</button>
        </div>
        <img id="noticeImgPreview" class="hide" alt="" style="margin-top:8px;max-width:100%;max-height:220px;border-radius:12px">
        <button class="lime" id="noticeSend" style="margin-top:14px">Send</button>
        <div class="progress hide" id="noticeBar"><div></div></div>
        <div class="small muted" id="noticeStatus" style="margin-top:8px"></div>
      </div>
    </div>
  </main>
</section>

<div id="shade" class="hide"></div>
<aside id="drawer" class="hide"></aside>
<div id="toast" class="hide"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(String(u || '')) ? String(u) : '');
  const fmt = (n) => (n == null ? '–' : Number(n).toLocaleString('en-US'));
  const when = (t) => {
    if (!t) return '';
    const d = new Date(t); if (isNaN(d)) return '';
    const s = (Date.now() - d) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    if (s < 86400 * 30) return `${Math.floor(s / 86400)} d ago`;
    return d.toLocaleDateString();
  };
  // ids are letters, numbers, _ and - only
  const cssEsc = (v) => (window.CSS && CSS.escape ? CSS.escape(String(v)) : String(v).replace(/[^A-Za-z0-9_-]/g, ''));
  const full = (t) => (t ? new Date(t).toLocaleString() : '–');

  // ---------------- session ----------------
  const KEY = 'ig_admin_session';
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { sess = null; }
  const save = () => (sess ? localStorage.setItem(KEY, JSON.stringify(sess)) : localStorage.removeItem(KEY));

  async function raw(body, token) {
    const r = await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({ error: `Server error (${r.status})` }));
    if (!r.ok) { const e = new Error(j.error || `Error ${r.status}`); e.status = r.status; throw e; }
    return j;
  }

  // v0.14: one password -> a 12 hour session token
  const live = (x) => !!(x && x.token && Date.parse(x.expiresAt) > Date.now());
  async function fresh() {
    if (!live(sess)) throw Object.assign(new Error(sess ? 'Login expired. Please log in again.' : 'Not logged in'), { status: 401 });
    return sess.token;
  }

  async function api(action, body = {}) {
    try {
      return await raw({ action, ...body }, await fresh());
    } catch (e) {
      if (e.status === 401) { logout(e.message); }
      throw e;
    }
  }

  function toast(text, ms = 2600) {
    const t = $('toast'); t.textContent = text; t.classList.remove('hide');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.add('hide'), ms);
  }
  const fail = (e) => toast(e.message || String(e), 6000);

  // ---------------- login ----------------
  function showMsg(text, ok = false) {
    const m = $('loginMsg'); m.textContent = text; m.className = ok ? 'msg ok' : 'msg';
  }
  $('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('loginBtn').disabled = true;
    try {
      const s = await raw({ action: 'login', password: $('password').value });
      sess = { token: s.token, expiresAt: s.expiresAt };
      save(); $('password').value = ''; $('loginMsg').classList.add('hide');
      start();
    } catch (e) { showMsg(e.message); }
    finally { $('loginBtn').disabled = false; }
  });
  function logout(reason) {
    sess = null; save();
    $('app').classList.add('hide'); $('login').classList.remove('hide'); closeDrawer();
    if (reason && reason !== true) showMsg(reason);
  }
  $('logout').addEventListener('click', () => logout(true));

  // ---------------- navigation ----------------
  const loaded = {};
  function go(page) {
    for (const b of $('nav').children) b.classList.toggle('on', b.dataset.page === page);
    for (const p of ['dash', 'users', 'posts', 'reports', 'notice']) $(`page-${p}`).classList.toggle('hide', p !== page);
    if (!loaded[page]) { loaded[page] = true; ({ dash: loadDash, users: () => loadUsers(true), posts: () => loadPosts(true), reports: () => loadReports(true), notice: () => {} })[page](); }
  }
  $('nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.page); });

  async function start() {
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    try {
      const me = await api('me');
      $('who').textContent = `logged in until ${new Date(sess.expiresAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      if (!me.ready) toast('FIREBASE_SERVICE_ACCOUNT is missing on Vercel: data can not load.', 9000);
    } catch (e) { if (e.status !== 401) fail(e); return; }
    for (const k of Object.keys(loaded)) delete loaded[k];
    go('dash');
  }

  // ---------------- cards ----------------
  const avatar = (u) => {
    const url = safeUrl(u.photoUrl);
    return url ? `<div class="av" style="background-image:url('${esc(url)}')"></div>` : `<div class="av">${esc((u.username || '?')[0].toUpperCase())}</div>`;
  };
  const userRow = (u) => `
    <div class="item" data-uid="${esc(u.uid)}">
      ${avatar(u)}
      <div class="grow" style="min-width:0">
        <div><b>@${esc(u.username || '(no username)')}</b>${u.verified ? '<span class="tag blue">verified</span>' : ''}${u.banned ? '<span class="tag red">blocked</span>' : ''}${u.private ? '<span class="tag lime">private</span>' : ''}</div>
        <div class="muted small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.name)} · ${esc(u.email)}</div>
      </div>
      <div class="muted small" style="text-align:right">${fmt(u.followers)} followers<br>${fmt(u.posts)} posts · ${esc(when(u.createdAt))}</div>
    </div>`;
  const tile = (p) => {
    const bg = safeUrl(p.thumb);
    const label = p.kind === 'moment' ? 'moment' : p.type === 'clip' ? 'clip' : 'post';
    return `<div class="tile" data-pid="${esc(p.id)}" data-kind="${esc(p.kind)}" style="${bg ? `background-image:url('${esc(bg)}')` : ''}">
      <span class="tag lime kind">${label}${p.count > 1 ? ` · ${p.count}` : ''}</span>
      ${!bg && p.isVideo ? '<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:30px">▶</div>' : ''}
      <div class="meta"><b>@${esc(p.authorUsername)}</b><br>${p.kind === 'moment' ? esc(when(p.createdAt)) : `♥ ${fmt(p.likes)} · 💬 ${fmt(p.comments)} · 👁 ${fmt(p.views)}`}</div>
    </div>`;
  };
  document.addEventListener('click', (e) => {
    const u = e.target.closest('[data-uid]'); if (u && !e.target.closest('button')) return openUser(u.dataset.uid);
    const p = e.target.closest('[data-pid]'); if (p && !e.target.closest('button')) return openPost(p.dataset.pid, p.dataset.kind);
  });

  // ---------------- dashboard ----------------
  async function loadDash() {
    $('stats').innerHTML = '<div class="muted">Loading…</div>';
    try {
      const s = await api('stats');
      const items = [
        ['Users', s.users], ['New today', s.users24h], ['New this week', s.users7d],
        ['Online now', s.online], ['Active today', s.active24h],
        ['Posts + clips', s.posts], ['Clips', s.clips], ['Posts', s.photos], ['Live moments', s.moments],
        ['Chats', s.chats], ['Open reports', s.reports], ['Blocked', s.banned], ['Verified', s.verified], ['Phones (push)', s.phones],
      ];
      $('stats').innerHTML = items.map(([l, n]) => `<div class="stat"><div class="n">${fmt(n)}</div><div class="l">${l}</div></div>`).join('');
    } catch (e) { $('stats').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
    api('users', {}).then((r) => { $('dashUsers').innerHTML = r.users.slice(0, 6).map(userRow).join('') || '<div class="muted">No users</div>'; }).catch((e) => { $('dashUsers').innerHTML = `<div class="msg">${esc(e.message)}</div>`; });
    api('posts', { type: 'all' }).then((r) => { $('dashPosts').innerHTML = r.posts.slice(0, 12).map(tile).join('') || '<div class="muted">No posts</div>'; }).catch((e) => { $('dashPosts').innerHTML = `<div class="msg">${esc(e.message)}</div>`; });
  }
  $('dashRefresh').addEventListener('click', loadDash);

  // ---------------- users ----------------
  // v0.14: filters (search text wins over the filter)
  let userCursor = '', userOffset = 0, userFilter = 'new';
  async function loadUsers(reset) {
    if (reset) { userCursor = ''; userOffset = 0; $('userList').innerHTML = '<div class="muted">Loading…</div>'; }
    try {
      const q = $('userQ').value.trim();
      const country = $('userCountry').value.trim().toUpperCase();
      if (!q && userFilter === 'country' && !/^[A-Z]{2}$/.test(country)) {
        $('userList').innerHTML = '<div class="muted">Type a 2 letter country code (like IN) and press Search.</div>';
        $('userMore').classList.add('hide');
        return;
      }
      const r = await api('users', q ? { q, cursor: userCursor } : { filter: userFilter, country, cursor: userCursor, offset: userOffset });
      if (reset) $('userList').innerHTML = '';
      $('userList').insertAdjacentHTML('beforeend', r.users.map(userRow).join('') || (reset ? '<div class="muted">No users found</div>' : ''));
      userCursor = r.cursor || ''; userOffset = r.offset || 0;
      $('userMore').classList.toggle('hide', !userCursor && !userOffset);
    } catch (e) { $('userList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  $('userTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    userFilter = b.dataset.filter;
    for (const x of $('userTabs').querySelectorAll('button')) x.classList.toggle('on', x === b);
    $('userCountry').classList.toggle('hide', userFilter !== 'country');
    $('userQ').value = '';
    if (userFilter === 'country') $('userCountry').focus();
    loadUsers(true);
  });
  $('userCountry').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); loadUsers(true); } });
  $('userSearch').addEventListener('submit', (e) => { e.preventDefault(); loadUsers(true); });
  $('userMore').addEventListener('click', () => loadUsers(false));

  // ---------------- posts ----------------
  let postType = 'all', postCursor = '';
  async function loadPosts(reset) {
    if (reset) { postCursor = ''; $('postGrid').innerHTML = '<div class="muted">Loading…</div>'; }
    try {
      const r = await api('posts', { type: postType, cursor: postCursor });
      if (reset) $('postGrid').innerHTML = '';
      $('postGrid').insertAdjacentHTML('beforeend', r.posts.map(tile).join('') || (reset ? '<div class="muted">Nothing here</div>' : ''));
      postCursor = r.cursor; $('postMore').classList.toggle('hide', !r.cursor);
    } catch (e) { $('postGrid').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  $('postTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    postType = b.dataset.type;
    for (const x of $('postTabs').children) x.classList.toggle('on', x === b);
    loadPosts(true);
  });
  $('postMore').addEventListener('click', () => loadPosts(false));

  // ---------------- reports ----------------
  let repCursor = '', repKind = '';
  const repRow = (r) => `
    <div class="item" style="cursor:default;align-items:flex-start" id="rep-${esc(r.id)}">
      <div class="grow">
        <div><span class="tag red">${esc(r.kind)}</span> <b>${esc(r.reason)}</b> <span class="muted small">· ${esc(when(r.createdAt))} · by @${esc(r.reporterUsername || r.reporterUid)}</span></div>
        ${r.message ? `<div style="margin-top:4px;white-space:pre-wrap">${esc(r.message)}</div>` : ''}
        <div class="row" style="margin-top:8px">
          ${r.postId ? `<button class="small" data-open-post="${esc(r.postId)}">Open post</button>` : ''}
          ${r.targetUid ? `<button class="small" data-open-user="${esc(r.targetUid)}">Open user</button>` : ''}
          <button class="lime small" data-done="${esc(r.id)}">Done</button>
        </div>
      </div>
    </div>`;
  async function loadReports(reset) {
    if (reset) { repCursor = ''; $('repList').innerHTML = '<div class="muted">Loading…</div>'; }
    try {
      const reason = $('repReason').value;
      const r = await api('reports', { cursor: repCursor, kind: repKind, reason });
      $('repInfo').classList.toggle('hide', !(repKind || reason));
      if (repKind || reason) $('repInfo').textContent = `${fmt(r.total)} found in the newest ${fmt(r.scanned)} reports`;
      if (reset) $('repList').innerHTML = '';
      $('repList').insertAdjacentHTML('beforeend', r.reports.map(repRow).join('') || (reset ? '<div class="muted">No open reports 🎉</div>' : ''));
      repCursor = r.cursor; $('repMore').classList.toggle('hide', !r.cursor);
    } catch (e) { $('repList').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  $('repRefresh').addEventListener('click', () => loadReports(true));
  $('repTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    repKind = b.dataset.kind;
    for (const x of $('repTabs').querySelectorAll('button')) x.classList.toggle('on', x === b);
    loadReports(true);
  });
  $('repReason').addEventListener('change', () => loadReports(true));
  $('repMore').addEventListener('click', () => loadReports(false));
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.openPost) return openPost(b.dataset.openPost, 'post');
    if (b.dataset.openUser) return openUser(b.dataset.openUser);
    if (b.dataset.done) {
      b.disabled = true;
      try { await api('resolveReport', { id: b.dataset.done }); const el = document.getElementById(`rep-${b.dataset.done}`); if (el) el.remove(); toast('Report closed'); }
      catch (err) { fail(err); b.disabled = false; }
    }
  });

  // ---------------- drawer ----------------
  function openDrawer(html) { $('drawer').innerHTML = html; $('drawer').classList.remove('hide'); $('shade').classList.remove('hide'); $('drawer').scrollTop = 0; }
  function closeDrawer() { $('drawer').classList.add('hide'); $('shade').classList.add('hide'); $('drawer').querySelectorAll('video').forEach((v) => v.pause()); }
  $('shade').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  const drawerHead = (title) => `<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">${title}</h2><button class="ghost" data-close>✕</button></div>`;
  $('drawer').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeDrawer(); });

  async function openUser(uid) {
    openDrawer(drawerHead('User') + '<div class="muted">Loading…</div>');
    try {
      const r = await api('user', { uid });
      const u = r.user;
      openDrawer(`${drawerHead(`@${esc(u.username)}`)}
        <div class="row">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b>${u.verified ? '<span class="tag blue">verified</span>' : ''}${u.banned ? '<span class="tag red">blocked</span>' : ''}<div class="muted small">${r.online ? '🟢 online' : r.lastActive ? `active ${esc(when(r.lastActive))}` : ''}</div></div></div>
        ${u.bio ? `<div style="margin:10px 0;white-space:pre-wrap">${esc(u.bio)}</div>` : ''}
        <div class="kv">
          <div>Email</div><div>${esc(u.email)} ${r.auth.emailVerified ? '✔' : ''}</div>
          <div>User id</div><div class="small">${esc(u.uid)}</div>
          <div>Followers</div><div>${fmt(u.followers)} · following ${fmt(u.following)}</div>
          <div>Posts</div><div>${fmt(u.posts)}</div>
          <div>Country</div><div>${esc(u.country || '–')} · language ${esc(u.language || '–')}</div>
          <div>Joined</div><div>${esc(full(u.createdAt || r.auth.createdAt))}</div>
          <div>Last login</div><div>${esc(full(r.auth.lastLoginAt))}</div>
          <div>Phones</div><div>${fmt(r.phones)} (for notifications)</div>
          ${r.auth.error ? `<div>Login account</div><div class="small">${esc(r.auth.error)}</div>` : ''}
        </div>
        <div class="row" style="margin:12px 0">
          <button class="blue" id="uVerify">${u.verified ? 'Remove badge' : 'Give verified badge'}</button>
          <button class="red" id="uBan">${u.banned ? 'Unblock' : 'Block account'}</button>
          <button id="uNotice">Send notice</button>
          <button id="uMail">Email</button>
          <button class="red" id="uDelete">Delete account</button>
        </div>
        <div class="progress hide" id="uDelBar"><div></div></div>
        <div class="small muted" id="uDelStatus"></div>
        ${r.reports.length ? `<h3>Reports about this user (${r.reports.length})</h3>${r.reports.map((x) => `<div class="small" style="margin:4px 0">• ${esc(x.reason)} — ${esc(x.message || '')} <span class="muted">${esc(when(x.createdAt))}</span></div>`).join('')}` : ''}
        <h3>Posts &amp; clips</h3>
        <div class="grid">${r.posts.map(tile).join('') || '<div class="muted">No posts</div>'}</div>`);
      $('uVerify').onclick = async () => {
        try {
          await api('verify', { uid, on: !u.verified });
          toast(u.verified ? 'Badge removed' : 'Verified badge given ✔');
          mail(u, u.verified ? 'unverify' : 'verify');
          openUser(uid);
        } catch (e) { fail(e); }
      };
      $('uBan').onclick = async () => {
        if (!u.banned && !confirm(`Block @${u.username}? They are logged out and can't log in any more.`)) return;
        try {
          await api('ban', { uid, on: !u.banned });
          toast(u.banned ? 'Unblocked' : 'Account blocked');
          mail(u, u.banned ? 'unblock' : 'block');
          openUser(uid);
        } catch (e) { fail(e); }
      };
      $('uMail').onclick = () => mail(u, 'plain');
      $('uDelete').onclick = () => deleteAccount(u);
      $('uNotice').onclick = () => { closeDrawer(); go('notice'); document.querySelector('input[name=to][value=one]').click(); $('noticeUser').value = u.username; pickUser(); };
    } catch (e) { openDrawer(drawerHead('User') + `<div class="msg">${esc(e.message)}</div>`); }
  }

  // ---------------- v0.14: email templates + delete account ----------------
  const MAILS = {
    verify: ['You are verified on InstantGram ✔', 'Good news! Your account now has the blue verified badge. People can see that your account is real.'],
    unverify: ['Your InstantGram verified badge was removed', 'Your account no longer has the verified badge.'],
    block: ['Your InstantGram account is blocked', 'Your account was blocked because it broke the InstantGram community rules. You can not log in now.'],
    unblock: ['Your InstantGram account is active again', 'Your account is not blocked any more. You can log in again.'],
    delete: ['Your InstantGram account was deleted', 'Your account and everything you shared (posts, clips, moments) were deleted because it broke the InstantGram community rules.'],
    plain: ['InstantGram', ''],
  };
  const openMail = (url) => (typeof window.igOpenMail === 'function' ? window.igOpenMail(url) : (window.location.href = url));
  function mail(u, kind) {
    if (!u.email) { toast('This user has no email address'); return; }
    const [subject, text] = MAILS[kind] || MAILS.plain;
    const body = `Hi @${u.username || 'there'},\n\n${text}${text ? '\n\nIf you think this is a mistake, just reply to this email.' : ''}\n\nThe InstantGram team\ntechlabs.hyper@gmail.com`;
    openMail(`mailto:${encodeURIComponent(u.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
  }
  async function deleteAccount(u) {
    const typed = prompt(`Delete @${u.username} for ever? Posts, clips, moments, followers and the login are removed. This can not be undone.\n\nType DELETE to confirm.`);
    if (typed !== 'DELETE') { if (typed !== null) toast('Not deleted (you must type DELETE)'); return; }
    const bar = $('uDelBar'), status = $('uDelStatus');
    $('uDelete').disabled = true; bar.classList.remove('hide');
    const names = { posts: 'posts & clips', moments: 'moments', followers: 'followers', following: 'following', lists: 'notifications & lists', account: 'profile & login' };
    let step = '', total = 0;
    try {
      for (let round = 0; round < 2000; round++) {
        const r = await api('deleteUser', { uid: u.uid, confirm: 'DELETE', step });
        total += r.n || 0;
        const i = r.done ? 6 : Math.max(0, ['posts', 'moments', 'followers', 'following', 'lists', 'account'].indexOf(r.step));
        bar.firstElementChild.style.width = `${Math.round((i / 6) * 100)}%`;
        status.textContent = r.done ? `Deleted ✔ (${fmt(total)} items)` : `Deleting ${names[r.step] || ''}… (${fmt(total)} items)`;
        if (r.done) break;
        step = r.step;
      }
      toast(`@${u.username} deleted`);
      document.querySelectorAll(`[data-uid="${cssEsc(u.uid)}"]`).forEach((el) => el.remove());
      mail(u, 'delete');
      setTimeout(closeDrawer, 1200);
    } catch (e) {
      status.textContent = `Stopped: ${e.message}. Press Delete again to continue.`;
      $('uDelete').disabled = false;
    }
  }

  async function openPost(id, kind) {
    openDrawer(drawerHead('Post') + '<div class="muted">Loading…</div>');
    try {
      const r = await api('post', { id, kind });
      const p = r.post;
      const media = p.media.map((m) => {
        const url = safeUrl(m.url);
        if (!url) return '';
        return m.video ? `<video src="${esc(url)}" poster="${esc(safeUrl(m.thumb))}" controls playsinline preload="metadata"></video>` : `<img src="${esc(url)}" alt="">`;
      }).join('');
      openDrawer(`${drawerHead(p.kind === 'moment' ? 'Moment' : p.type === 'clip' ? 'Clip' : 'Post')}
        <div class="row"><b class="grow" data-uid="${esc(p.authorId)}" style="cursor:pointer">@${esc(p.authorUsername)}</b><span class="muted small">${esc(full(p.createdAt))}</span></div>
        <div class="media">${media}</div>
        ${p.caption ? `<div style="white-space:pre-wrap;margin-bottom:8px">${esc(p.caption)}</div>` : ''}
        ${p.kind === 'moment' ? `<div class="muted small">Ends ${esc(full(p.expiresAt))}</div>` : `<div class="muted small">♥ ${fmt(p.likes)} · 💬 ${fmt(p.comments)} · 👁 ${fmt(p.views)}</div>`}
        <div class="row" style="margin:12px 0"><button class="red" id="pDel">Delete ${p.kind === 'moment' ? 'moment' : p.type === 'clip' ? 'clip' : 'post'}</button></div>
        ${p.kind === 'moment' ? '' : `<h3>Comments (${r.comments.length})</h3>${r.comments.map((c) => `
          <div class="comment" id="c-${esc(c.id)}">
            <div class="grow"><b data-uid="${esc(c.authorId)}" style="cursor:pointer">@${esc(c.authorUsername)}</b> <span class="muted small">${esc(when(c.createdAt))}</span>
              <div style="white-space:pre-wrap">${esc(c.text)}</div>
              ${safeUrl(c.imageUrl) ? `<img src="${esc(safeUrl(c.imageUrl))}" alt="" style="max-height:120px;border-radius:8px;margin-top:4px">` : ''}</div>
            <button class="red small" data-del-comment="${esc(c.id)}">Delete</button>
          </div>`).join('') || '<div class="muted">No comments</div>'}`}`);
      $('pDel').onclick = async () => {
        if (!confirm('Delete it for everyone? This can not be undone.')) return;
        try { await api('deletePost', { id, kind: p.kind }); toast('Deleted'); closeDrawer(); document.querySelectorAll(`[data-pid="${cssEsc(id)}"]`).forEach((el) => el.remove()); } catch (e) { fail(e); }
      };
      $('drawer').querySelectorAll('[data-del-comment]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Delete this comment?')) return;
          try { await api('deleteComment', { postId: id, id: b.dataset.delComment }); document.getElementById(`c-${b.dataset.delComment}`)?.remove(); toast('Comment deleted'); } catch (e) { fail(e); }
        };
      });
    } catch (e) { openDrawer(drawerHead('Post') + `<div class="msg">${esc(e.message)}</div>`); }
  }

  // ---------------- notice ----------------
  let noticeUid = '';
  document.querySelectorAll('input[name=to]').forEach((r) => r.addEventListener('change', () => {
    $('noticeOne').classList.toggle('hide', document.querySelector('input[name=to]:checked').value !== 'one');
  }));
  let pickTimer = 0;
  async function pickUser() {
    noticeUid = '';
    const q = $('noticeUser').value.trim().replace(/^@/, '').toLowerCase();
    if (!q) { $('noticeUserInfo').textContent = ''; return; }
    try {
      const r = await api('users', { q });
      const u = r.users.find((x) => x.username === q) || null;
      noticeUid = u ? u.uid : '';
      $('noticeUserInfo').textContent = u ? `✔ @${u.username} (${u.name || u.email})` : 'No user with this username';
    } catch (e) { $('noticeUserInfo').textContent = e.message; }
  }
  $('noticeUser').addEventListener('input', () => { clearTimeout(pickTimer); pickTimer = setTimeout(pickUser, 400); });
  // v0.14: notice picture -> made smaller in the browser (JPEG, max 1280 px)
  let noticeJpeg = '';
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k));
        c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        let q = 0.85, out = c.toDataURL('image/jpeg', q);
        while (out.length > 1.3 * 1024 * 1024 && q > 0.4) { q -= 0.15; out = c.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This picture can not be opened')); };
      img.src = url;
    });
  }
  $('noticeImg').addEventListener('change', async () => {
    const f = $('noticeImg').files[0];
    noticeJpeg = '';
    $('noticeImgPreview').classList.add('hide'); $('noticeImgDel').classList.add('hide');
    if (!f) return;
    try {
      noticeJpeg = await shrink(f);
      $('noticeImgPreview').src = noticeJpeg;
      $('noticeImgPreview').classList.remove('hide'); $('noticeImgDel').classList.remove('hide');
    } catch (e) { fail(e); $('noticeImg').value = ''; }
  });
  $('noticeImgDel').addEventListener('click', () => {
    noticeJpeg = ''; $('noticeImg').value = '';
    $('noticeImgPreview').classList.add('hide'); $('noticeImgDel').classList.add('hide');
  });

  $('noticeSend').addEventListener('click', async () => {
    const all = document.querySelector('input[name=to]:checked').value === 'all';
    const title = $('noticeTitle').value.trim() || 'InstantGram';
    const text = $('noticeText').value.trim();
    if (!text) return toast('Write the message');
    if (!all && !noticeUid) return toast('Pick a user first');
    if (all && !confirm('Send this notice to EVERYONE?')) return;
    $('noticeSend').disabled = true;
    const bar = $('noticeBar'), status = $('noticeStatus');
    let sent = 0, failed = 0, people = 0, page = '', imageUrl = '';
    try {
      if (noticeJpeg) {
        status.textContent = 'Uploading the picture…';
        imageUrl = (await api('noticeImage', { image: noticeJpeg })).url;
      }
      if (!all) {
        const r = await api('notice', { to: noticeUid, title, text, imageUrl });
        status.textContent = `Done: saved in the app's notifications, ${r.sent} phone(s) got it${r.failed ? `, ${r.failed} old phone(s) failed` : ''}.`;
      } else {
        bar.classList.remove('hide');
        for (let round = 0; round < 1000; round++) {
          const r = await api('notice', { to: 'all', title, text, page, imageUrl });
          sent += r.sent; failed += r.failed; people += r.people;
          bar.firstElementChild.style.width = r.done ? '100%' : `${Math.min(95, 10 + round * 8)}%`;
          status.textContent = `${fmt(people)} people · ${fmt(sent)} phones got it${failed ? ` · ${fmt(failed)} old phones failed` : ''}${r.done ? ' · Done ✔' : ' …'}`;
          if (r.done) break;
          page = r.page;
        }
      }
      $('noticeText').value = '';
      $('noticeImgDel').click();
    } catch (e) { status.textContent = `Stopped: ${e.message}`; }
    finally { $('noticeSend').disabled = false; }
  });

  // ---------------- go ----------------
  if (live(sess)) start(); else { sess = null; save(); $('login').classList.remove('hide'); }
})();
</script>
</body>
</html>
