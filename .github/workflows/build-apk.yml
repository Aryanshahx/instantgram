name: Build Android APK + AAB

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['backend/**', '**/*.md', 'firestore.rules', 'firestore.indexes.json']
  pull_request:
    branches: [main]
    paths-ignore: ['backend/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Check backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "Backend URL from GitHub variable: $API_BASE_URL"
          elif grep -q "kDefaultApiBaseUrl = 'https://" lib/core/config/api_url.dart; then
            echo "Backend URL from lib/core/config/api_url.dart"
          else
            echo "::warning::No backend URL set. Uploads will not work. Set repo variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables)."
          fi

      # v0.20: your own signing key (same key for the APK and the .aab).
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
            echo "Release key found"
          else
            echo "::warning::No signing key secrets. The APK uses a temporary debug key and no .aab is made. Add the 4 ANDROID_* secrets (Settings > Secrets and variables > Actions)."
          fi

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build release AAB (for Google Play)
        if: env.HAS_RELEASE_KEY == '1'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK and AAB
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/InstantGram-build-${{ github.run_number }}.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab \
               release/InstantGram-build-${{ github.run_number }}.aab
          fi
          rm -f android/app/upload-keystore.jks
          ls -la release

      - name: Show signing key fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release/*.apk | grep -E "SHA-256|SHA-1" || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantGram-apk-${{ github.run_number }}
          path: release/*.apk
          retention-days: 14

      - name: Upload AAB artifact
        if: env.HAS_RELEASE_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: InstantGram-aab-${{ github.run_number }}
          path: release/*.aab
          retention-days: 14

      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
