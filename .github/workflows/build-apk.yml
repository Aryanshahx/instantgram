name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['backend/**', '**/*.md', 'firestore.rules', 'firestore.indexes.json']
  pull_request:
    branches: [main]
    paths-ignore: ['backend/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Check backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "Backend URL from GitHub variable: $API_BASE_URL"
          elif grep -q "kDefaultApiBaseUrl = 'https://" lib/core/config/api_url.dart; then
            echo "Backend URL from lib/core/config/api_url.dart"
          else
            echo "::warning::No backend URL set. Uploads will not work. Set repo variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables)."
          fi

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/InstantGram-build-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantGram-apk-${{ github.run_number }}
          path: release/*.apk
          retention-days: 14

      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
